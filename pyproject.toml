[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-operations-ai-agent"
version = "0.1.0"
description = "Tool-using AI agent for safe, observable hotel operations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai>=1.40,<4",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentpms.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests contractuels contre les services locaux",
]
